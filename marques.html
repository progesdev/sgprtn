<style>
:root{--navy:#0a0a5a;--grey:#787269;--red:#d0110f;--light:#f5f5f7}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;flex-direction:column;font-family:"Ubuntu","Segoe UI",Arial,sans-serif;background:#fff;color:#222}
a{text-decoration:none;color:inherit}
.topbar{background:var(--grey);min-height:40px;display:flex;align-items:center;justify-content:space-between;padding-left:18%;font-size:14px;color:#fff}
.topbar .infos{display:flex;gap:30px;flex-wrap:wrap}
.topbar .devis{background:var(--navy);height:40px;padding:0 22px;display:flex;align-items:center;font-weight:700;margin-right:9%}
.nav{height:76px;background:#fff;display:flex;align-items:center;padding-left:30%;position:relative;border-bottom:1px solid #eee}
.nav a:not(.logo){padding:0 25px;font-weight:700;font-size:14px;color:var(--navy);text-transform:uppercase;height:76px;display:flex;align-items:center}

.social-links{margin-left:auto;padding:0 30px 0 12px;display:flex;align-items:center;gap:7px;flex:0 0 auto}
.social-link{width:34px;height:34px;padding:0!important;border:1.5px solid var(--navy);border-radius:6px;display:grid!important;place-items:center;color:var(--navy)!important;background:#fff;transition:background .2s ease,color .2s ease,transform .2s ease,border-color .2s ease}
.social-link svg{width:17px;height:17px;display:block;fill:currentColor;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.social-link:hover,.social-link:focus-visible{background:var(--navy);color:#fff!important;border-color:var(--navy);transform:translateY(-2px)}

/* Onglet actif : bloc bleu plein comme la référence */
.nav a.active{
  color:#fff!important;
  background:var(--navy);
  border:0;
  border-radius:0;
  padding:0 25px!important;
  height:76px;
  display:flex;
  align-items:center;
}
.nav a.active:hover,.nav a.active:focus-visible{
  color:#fff!important;
  background:var(--navy);
}

.logo{position:absolute;left:0;top:0;width:28%;height:118px;background:#fff;display:flex;align-items:center;justify-content:center;z-index:2;clip-path:polygon(0 0,100% 0,100% 45%,88% 100%,0 100%)}
.logo img{width:min(92%,360px);height:auto}

/* Style demandé : titre centré + carrousel horizontal */
.marques-page{padding:48px 5% 85px;min-height:620px}
.marques-title{text-align:center;margin:0 auto 34px}
.marques-title h1{color:var(--red);font-size:48px;font-weight:800;margin-bottom:18px}
.marques-title .line{width:118px;height:5px;background:#555;margin:auto}
.carousel-wrap{max-width:1500px;margin:auto;position:relative}
.carousel-window{overflow:hidden;padding:18px 50px}
.carousel-track{display:flex;gap:38px;transition:transform .45s ease}
.brand-item{flex:0 0 calc((100% - 152px)/5);height:125px;display:flex;align-items:center;justify-content:center;background:transparent}
.brand-item img{max-width:100%;max-height:105px;width:auto;height:auto;object-fit:contain;filter:none;transition:transform .25s ease}
.brand-item:hover img{transform:scale(1.07)}
.arrow{position:absolute;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--navy);font-size:52px;line-height:1;cursor:pointer;z-index:3;padding:4px 10px}
.arrow:hover{color:var(--red)}
.arrow.left{left:0}.arrow.right{right:0}
.brand-caption{text-align:center;color:#666;font-size:14px;margin-top:14px}

/* Keep footer from previous design */
footer{margin-top:auto;position:relative;background:#030329;min-height:110px;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
footer:before{content:"";position:absolute;left:0;top:0;width:38%;height:70px;background:var(--light);clip-path:polygon(0 0,100% 0,84% 100%,0 100%)}
footer div{position:relative;z-index:1;color:#fff;font-size:20px}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.anim{opacity:0;animation:fadeUp .7s ease forwards}.d1{animation-delay:.12s}.d2{animation-delay:.24s}
.logo img{animation:fadeUp .7s ease both}

@media(max-width:1000px){
  .social-links{padding-right:16px;gap:6px}.social-link{width:32px;height:32px}
  .topbar{padding:8px 16px;gap:10px;align-items:flex-start}.topbar .infos{gap:8px;font-size:11px}.topbar .devis{margin-right:0;white-space:nowrap}
  .nav{padding-left:0;height:auto;min-height:64px;overflow-x:auto}
  .logo{position:relative;width:280px;min-width:280px;height:80px;clip-path:none}.logo img{width:250px}
  .nav a:not(.logo){padding:0 18px;white-space:nowrap;height:64px}
  .nav a.active{height:64px;padding:0 18px!important}
  .brand-item{flex-basis:calc((100% - 38px)/2)}
}
@media(max-width:600px){
  .marques-page{padding:38px 3% 60px}.marques-title h1{font-size:36px}.carousel-window{padding:12px 34px}.carousel-track{gap:16px}.brand-item{flex-basis:100%;height:115px}.arrow{font-size:42px}
}
@media(max-width:600px){
  .social-link{width:30px;height:30px}.social-link svg{width:15px;height:15px}
}
</style>

<main class="marques-page">
  <div class="marques-title anim">
    <h1>Nos Marques</h1>
    <div class="line"></div>
  </div>

  <section class="carousel-wrap anim d1" aria-label="Nos marques">
    <button class="arrow left" id="prev" aria-label="Marques précédentes">‹</button>
    <div class="carousel-window">
      <div class="carousel-track" id="brandTrack">
        <div class="brand-item"><img src="assets/brand-scania.png" alt="Scania"></div>
        <div class="brand-item"><img src="assets/brand-renault-trucks.png" alt="Renault Trucks"></div>
        <div class="brand-item"><img src="assets/brand-iveco.png" alt="Iveco"></div>

        <div class="brand-item"><img src="assets/brand-tcm.png" alt="TCM"></div>
        <div class="brand-item"><img src="assets/brand-linde.png" alt="Linde Material Handling"></div>
        <div class="brand-item"><img src="assets/brand-isuzu.png" alt="Isuzu"></div>
      </div>
    </div>
    <button class="arrow right" id="next" aria-label="Marques suivantes">›</button>
    <div class="brand-caption">Faites défiler pour découvrir toutes les marques.</div>
  </section>
</main>

<script>
(function(){
  const track=document.getElementById('brandTrack');
  const prev=document.getElementById('prev');
  const next=document.getElementById('next');
  let index=0;

  function visible(){
    if(window.innerWidth<=600)return 1;
    if(window.innerWidth<=1000)return 2;
    return 5;
  }

  function step(){
    const item=track.querySelector('.brand-item');
    if(!item)return 0;
    return item.getBoundingClientRect().width + parseFloat(getComputedStyle(track).gap || 0);
  }

  function render(){
    const max=Math.max(0,track.children.length-visible());
    index=Math.min(Math.max(index,0),max);
    track.style.transform='translateX(-'+(index*step())+'px)';
  }

  prev.addEventListener('click',function(){index--;render()});
  next.addEventListener('click',function(){index++;render()});
  window.addEventListener('resize',render);
  render();
})();
</script>
